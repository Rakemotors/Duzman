[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duzman"
version = "0.1.0"
description = "Personal crypto metrics monitor"
requires-python = ">=3.12"
dependencies = [
    "beautifulsoup4",
    "lxml",
    "pandas-ta",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]
