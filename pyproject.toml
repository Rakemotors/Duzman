[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "duzman"
version = "0.1.0"
description = "Personal crypto metrics monitor"
requires-python = ">=3.12"
dependencies = [
    "aiosqlite",
    "alembic==1.15.2",
    "anthropic==0.52.0",
    "apscheduler==3.11.0",
    "asyncpg>=0.29,<1.0",
    "beautifulsoup4==4.13.4",
    "fastapi>=0.115,<0.116",
    "httpx==0.28.1",
    "lxml",
    "pandas>=2.3.2",
    "pandas-ta==0.4.67b0",
    "psycopg2-binary==2.9.10",
    "pydantic==2.11.4",
    "pydantic-settings==2.9.1",
    "python-telegram-bot==21.11.1",
    "sqlalchemy==2.0.40",
    "uvicorn[standard]>=0.34,<0.35",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
    "pytest-asyncio>=0.23",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "src"
namespace_packages = true
explicit_package_bases = true
