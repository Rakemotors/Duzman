name: Agent PR Check

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  agent-pr-check:
    name: Agent PR Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up uv and virtualenv
        run: |
          python -m pip install --upgrade pip
          python -m pip install uv
          uv venv .venv --python 3.12
          uv pip install --python .venv/bin/python -e ".[dev]"
          uv pip install --python .venv/bin/python \
            alembic \
            apscheduler \
            fastapi \
            httpx \
            pydantic \
            pydantic-settings \
            pytest==8.3.5 \
            pytest-asyncio==0.26.0 \
            PyYAML \
            SQLAlchemy \
            structlog

      - name: pytest
        run: .venv/bin/pytest -q

      - name: ruff
        continue-on-error: true
        run: .venv/bin/ruff check .

      - name: mypy
        continue-on-error: true
        run: .venv/bin/mypy .

      - name: grep forbidden diff content
        run: |
          set -euo pipefail

          base_sha="${{ github.event.pull_request.base.sha }}"
          head_sha="${{ github.event.pull_request.head.sha }}"
          changed_files="$(git diff --name-only "$base_sha" "$head_sha")"

          if printf '%s\n' "$changed_files" | grep -Eq '(^|/)\.env([^/]*$|/)|(^|/)[^/]+\.key$'; then
            echo "Forbidden credential-like file path found in PR diff."
            printf '%s\n' "$changed_files" | grep -E '(^|/)\.env([^/]*$|/)|(^|/)[^/]+\.key$'
            exit 1
          fi

          key_pattern='[A]NTHROPIC_API_KEY='
          telegram_pattern='[T]ELEGRAM_BOT_TOKEN='
          postgres_pattern='[p]ostgres://.*:.*@'

          if git diff --unified=0 "$base_sha" "$head_sha" \
            | grep -E '^\+' \
            | grep -Ev '^\+\+\+' \
            | grep -E "${key_pattern}|${telegram_pattern}|${postgres_pattern}"; then
            echo "Forbidden secret-like value found in PR diff."
            exit 1
          fi
